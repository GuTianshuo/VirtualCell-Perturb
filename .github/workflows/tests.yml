name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install numpy pandas scipy scikit-learn statsmodels pytest
      - name: Unit tests (data-free)
        run: pytest -q tests
